<style>
  :root {

  .exec-note { font-size: 0.78em; opacity: 0.7; margin: -4px 0 10px; }

  .rv2-track span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(90deg, #1fa463, #3b82f6); }
  .rv2-track.warn span { background: linear-gradient(90deg, #d68f00, #f5b301); } .rv2-track.bad span { background: linear-gradient(90deg, #d23f31, #f06b5b); }

  @media (max-width: 760px) { .rv2-grid { grid-template-columns: minmax(0, 1fr); } }
  .rv2-card { border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 12px 14px; min-width: 0; border-top: 4px solid #1fa463; }
  .rv2-card.s-pending-credential { border-top-color: #d68f00; } .rv2-card.s-pilot { border-top-color: #8b5cf6; } .rv2-card.s-no-data { border-top-color: #9ca3af; }
  .rv2-card h4 { margin: 0 0 2px; display: flex; justify-content: space-between; gap: 8px; }

  .p2-table { width: 100%; border-collapse: collapse; font-size: 0.82em; margin: 6px 0 12px; } .p2-table th, .p2-table td { text-align: left; padding: 3px 6px; border-bottom: 1px solid rgba(128,128,128,0.25); vertical-align: top; overflow-wrap: anywhere; }
  .p2-scratch { font-weight: 600; margin: 4px 0; } .p2-scratch.bad { color: var(--bad); }
  .rv2-head { font-weight: 600; margin: 4px 0; }
  .rv2-role { font-size: 0.84em; opacity: 0.85; margin-bottom: 6px; }
  .rv2-card table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 0.8em; }
  .rv2-card td { padding: 3px 4px; border-top: 1px solid var(--line); overflow-wrap: anywhere; vertical-align: top; }
  .rv2-card td:first-child { width: 44%; opacity: 0.8; }
  .rv2-card details summary { cursor: pointer; font-size: 0.82em; margin-top: 6px; }
  .rv2-src { font-size: 0.74em; opacity: 0.7; margin-top: 6px; overflow-wrap: anywhere; }
  .rv2-pend { font-size: 0.85em; margin-top: 10px; }
  .pv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: stretch; margin-top: 12px; }
  @media (max-width: 760px) { .pv-grid { grid-template-columns: minmax(0, 1fr); } }
  .pv-card { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 12px 14px; display: grid; grid-template-rows: auto 2.6em minmax(7.5em, auto) auto auto; row-gap: 8px; }
  .pv-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; column-gap: 8px; }
  .pv-head h4 { margin: 0; font-size: 1.02em; }
  .pv-plan { font-size: 0.8em; padding: 2px 8px; border-radius: 99px; background: var(--chip); white-space: nowrap; }

  .pv-kv .h { color: var(--muted); }
  .pv-foot { color: var(--muted); font-size: 0.78em; }

  .pv-card details td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .exec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .gcard { border-radius: 16px; padding: 14px; background: linear-gradient(160deg, rgba(127,127,127,0.10), rgba(127,127,127,0.03)); border: 1px solid rgba(127,127,127,0.22); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }

  .gauge text { fill: currentColor; font-weight: 700; }
  .t-green .arc { stroke: #1fa463; } .t-amber .arc { stroke: #d68f00; } .t-red .arc { stroke: #d93025; }
  .t-unknown .arc, .t-stale .arc { stroke: #8a8a8a; } .t-parked .arc { stroke: #8a8a8a; }
  .t-spend .arc { stroke: #3b82f6; }
  .gcard .head { font-weight: 600; font-size: 0.95em; }

  .gcard .subl { font-size: 0.75em; opacity: 0.65; }
  .pace { font-size: 0.75em; border-radius: 999px; padding: 2px 8px; }

  details.util-details > summary::after { content: " \25B8"; }
  details.util-details[open] > summary::after { content: " \25BE"; }
  :root { --hw-gap: 12px; --hw-pad: 16px; --hw-row: 10px; }

    display: grid; grid-row: span 6; grid-template-rows: subgrid; row-gap: var(--hw-row); min-width: 0; }

  .pool-banner {

  button.connect, a.connect {

  article, tr[id], div[id] { scroll-margin-top: 12px; }
  @media (forced-colors: active) {

  pre.tail { white-space: pre-wrap; margin: 4px 0 8px; color: var(--muted); font-size: 12px; }

  details.insight::details-content { padding-top: 8px; }

    .pill.yes, .pill.off_track, .pill.at_risk,

  header form { display: inline; margin-left: 12px; }
  header button { font: inherit; font-weight: 700; }
  dl.insight { margin: 8px 0 0; }

  /* Executive view: a decision-first canvas over the original evidence views. */
  :root { color-scheme: light dark; --bg:#f3f5f1; --card:#fff; --text:#18372d; --muted:#63736c; --line:#dce4dc; --navy:#163e32; --green:#287152; --ok:#24724f; --bad:#af4438; --run:#286a62; --pend:#89642b; --accent:#89642b; --chip:#edf3e9; --lime:#d4f18a; --on-band:#fff; }
  body { font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif; font-size:14px; line-height:1.55; }
  main { max-width:1480px; padding:0 40px 64px; }
  header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 24px; border:0; border-radius:0; color:var(--text); background:none; margin:0; padding:25px 0 22px; }
  header .mast { margin:0; gap:13px; }
  header .mast img { width:42px; height:42px; object-fit:contain; }
  header h1 { color:var(--text); font-size:18px; letter-spacing:-.5px; font-weight:700; margin:0; }
  header .sub,header a,header button { color:var(--muted); font-size:12px; text-decoration:none; }
  header nav { display:flex; align-items:center; gap:20px; }
  header form { margin:0; }
  header #clock { width:100%; font-size:11px; margin-top:-6px; }
  #live { display:inline-flex; gap:5px; align-items:center; }
  #live:before { content:""; width:6px; height:6px; border-radius:50%; background:var(--green); }
  .section-nav { display:flex; gap:5px; overflow-x:auto; border-bottom:1px solid var(--line); padding:0 0 13px; margin-bottom:24px; scrollbar-width:thin; }
  .section-nav a { color:var(--muted); text-decoration:none; font-weight:600; padding:7px 14px; border-radius:20px; white-space:nowrap; font-size:12px; }
  .section-nav a[aria-current="location"],.section-nav a:hover { background:#e4ecdf; color:var(--text); }
  .sec { margin:30px 0; scroll-margin-top:20px; }
  .band { background:none; color:var(--text); border:0; border-radius:0; padding:0; margin:0 0 16px; }
  .band h2 { color:var(--text); font-size:21px; letter-spacing:-.6px; font-weight:650; }
  h3 { font-size:16px; flex:0 1 auto; line-height:1.4; }
  h4 { margin:14px 0 8px; }
  p { margin:0 0 10px; }
  .card,.hwcard { border:1px solid var(--line); border-radius:17px; box-shadow:none; padding:22px; background:var(--card); min-width:0; }
  .grid.two { grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  .eyebrow { text-transform:uppercase; letter-spacing:1.6px; font-size:10px; font-weight:750; color:var(--muted); margin-bottom:9px; }
  .section-title { display:flex; align-items:flex-end; gap:18px; justify-content:space-between; margin:0 0 17px; }
  .section-title h2 { font-size:22px; font-weight:650; letter-spacing:-.6px; }
  .section-title p { color:var(--muted); font-size:12px; margin:3px 0 0; }
  .exec-hero { border-radius:24px; background:#163e32; color:#f5f7f0; padding:32px 34px 26px; position:relative; overflow:hidden; }
  .exec-hero:after { content:""; position:absolute; height:300px; width:300px; border:1px solid rgba(211,241,138,.1); border-radius:50%; right:-130px; top:-100px; pointer-events:none; }
  .hero-intro { display:flex; justify-content:space-between; gap:30px; align-items:flex-start; }

  .next-action { border-top:1px solid #e6ebe3; padding-top:12px; margin-top:auto; font-size:12px; line-height:1.6; }
  .next-action span { color:var(--muted); display:block; font-size:9px; font-weight:750; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
  .goal-evidence { margin-top:3px; font-size:11px; }
  .goal-evidence summary { color:#507361; cursor:pointer; font-weight:600; }
  .evidence-list { list-style:none; padding:0; margin:12px 0 0; }
  .evidence-list li { padding:7px 0; border-top:1px solid var(--line); color:var(--muted); }
  .evidence-list b { color:var(--text); font-weight:600; }
  .impact-shell { padding:24px; }
  .impact-toolbar { display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .segmented { display:flex; padding:4px; background:#edf1e8; border-radius:22px; gap:2px; }
  .impact-tab,.platform-filter { appearance:none; border:0; border-radius:18px; padding:7px 15px; color:var(--muted); background:transparent; font:600 11px/1.4 inherit; cursor:pointer; font-family:inherit; }
  .impact-tab[aria-selected=true],.platform-filter[aria-pressed=true] { color:var(--text); background:white; box-shadow:0 1px 4px #18372d10; }
  .impact-kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); padding:0 0 23px; margin-bottom:23px; border-bottom:1px solid var(--line); gap:22px; }

  function chart(runs) {
    var today = runs.filter(function (r) { return r.today; });
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "chart");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Today pipeline duration and per-step outcome");
    if (!today.length) {
      svg.setAttribute("viewBox", "0 0 640 36");
      var t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", "12");
      t.setAttribute("y", "22");
      t.setAttribute("fill", "currentColor");
      t.textContent = "No pipeline runs started today.";
      svg.appendChild(t);
      return svg;
    }
    var row = 26;
    var h = today.length * row + 28;
    svg.setAttribute("viewBox", "0 0 760 " + h);
    var max = 1;
    today.forEach(function (r) { if ((r.elapsed_s || 0) > max) max = r.elapsed_s; });
    var colors = { pass: "#0f7a45", fail: "#9f1d16", run: "#1d4e89", pending: "#8a8175" };
    today.forEach(function (r, i) {
      var y = 16 + i * row;
      var label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("x", "8");
      label.setAttribute("y", String(y));
      label.setAttribute("fill", "currentColor");
      label.setAttribute("font-size", "12");
      var chartText = (r.chart_label || r.fm_label || r.label || r.head8 || r.name || "") + " " + (r.elapsed || "");
      if (chartText.length > 42) chartText = chartText.slice(0, 41) + "…";
      label.textContent = chartText;
      svg.appendChild(label);
      var steps = r.steps || [];
      var denom = 0;
      steps.forEach(function (s) { denom += s.duration_s || 0; });
      if (!denom) denom = steps.length || 1;
      var x = 280;
      var runW = Math.max(8, ((r.elapsed_s || 0) / max) * 450);
      steps.forEach(function (s) {
        var share = (s.duration_s || (denom / (steps.length || 1))) / denom;
        var w = Math.max(2, share * runW);
        var rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", String(x));
        rect.setAttribute("y", String(y - 10));
        rect.setAttribute("width", String(w));
        rect.setAttribute("height", "14");
        rect.setAttribute("fill", colors[s.state] || colors.pending);
        rect.setAttribute("class", "chart-step-" + (/^(pass|fail|run|pending)$/.test(s.state) ? s.state : "pending"));
        var title = document.createElementNS("http://www.w3.org/2000/svg", "title");
        title.textContent = (s.word || s.name) + " " + (s.state || "") + (s.exit == null ? "" : " " + s.exit);
        rect.appendChild(title);
        svg.appendChild(rect);
        x += w;
      });
    });
    return svg;
  }

    sec.appendChild(secHead("GitHub", g));
    var err = errorLine(g);
    if (err) sec.appendChild(err);
    if (g && g.backoff) sec.appendChild(el("p", "err", g.backoff));
    if (g && g.rate) {
      sec.appendChild(el("p", "muted", "core " + g.rate.remaining + "/" + g.rate.limit +
        (g.rate.reset_et ? " · reset " + g.rate.reset_et : "") +
        (g.rate.backed_off ? " · backed off" : "")));
    }
    sec.appendChild(el("p", "asof" + (refs && refs.stale ? " stale" : ""), "local refs " + asof(refs)));
    if (refs && refs.error) sec.appendChild(el("p", "err", refs.error));
    var prs = (g && g.prs) || [];
    prs.slice(0, 10).forEach(function (pr) {
      var c = el("article", "card");
      var head = el("div", "row");
      head.appendChild(safeLink(pr.url, "#" + pr.number + " " + (pr.title || "")));
      if (pr.draft) head.appendChild(el("span", "pill pending", "draft"));
      c.appendChild(head);
      c.appendChild(el("p", "mono", (pr.head || "") + " @ " + (pr.sha || "")));
      var local = "local " + (pr.local_sha || "—");
      if (pr.local_sha && pr.sha && pr.local_sha !== pr.sha) local += " (differs from GitHub " + pr.sha + ")";
      c.appendChild(el("p", "muted", local));
      var cr = el("p");
      cr.textContent = "CodeRabbit: " + (pr.coderabbit || "no review yet");
      if (pr.others && pr.others.length) {
        cr.textContent += " · " + pr.others.map(function (o) { return o.author + " " + o.state; }).join(", ");
      }
      c.appendChild(cr);
      var checks = pr.checks || {};
      c.appendChild(el("p", null, "checks pass " + (checks.pass || 0) + " / fail " + (checks.fail || 0) + " / pending " + (checks.pending || 0)));
      if (pr.failed_names && pr.failed_names.length) c.appendChild(el("p", "mono", pr.failed_names.join(", ")));
      if (pr.hold) c.appendChild(el("p", null, "hold: " + pr.hold));
      if (pr.comments_note) c.appendChild(el("p", "muted", pr.comments_note));
      var comments = el("div", "scroll");
      comments.dataset.key = "pr:" + (pr.number || "");
      (pr.comments || []).forEach(function (cm) {
        var p = el("p");
        p.appendChild(el("span", "k", (cm.author || "") + ": "));
        p.appendChild(document.createTextNode(cm.snippet || ""));
        if (cm.url) {
          p.appendChild(document.createTextNode(" "));
          p.appendChild(safeLink(cm.url, "comment"));
        }
        comments.appendChild(p);
      });
      if ((pr.comments || []).length) c.appendChild(comments);
      sec.appendChild(c);
    });
    if (prs.length > 10) {
      sec.appendChild(showMore("eng:github-more", prs.length - 10, function (more) {
        var list = el("ul", "clean");
        prs.slice(10).forEach(function (pr) {
          var li = document.createElement("li");
          li.appendChild(safeLink(pr.url, "#" + pr.number + " " + (pr.title || "")));
          list.appendChild(li);
        });
        more.appendChild(list);
      }));
    }
    if (!prs.length) sec.appendChild(el("p", "muted", "No cached pull requests yet."));
    return sec;
  }

  function engineeringPart(key, title, node) {
    var box = takeDetails("eng-block", key);
    var summary = document.createElement("summary");
    summary.textContent = title;
    box.appendChild(summary);
    if (node) box.appendChild(node);
    return box;
  }
  function renderHistory(state) {
    var sec = el("section", "sec");
    sec.id = "history";
    var box = takeDetails("eng", "eng:detail");
    var summary = document.createElement("summary");
    summary.textContent = "Engineering detail";
    box.appendChild(summary);
    box.appendChild(engineeringPart("eng:pipelines", "Pipelines", renderPipelines(state.pipelines)));
    box.appendChild(engineeringPart("eng:lanes", "Headless lanes", renderLanes(state.lanes)));
    box.appendChild(engineeringPart("eng:feed", "Status feed", renderFeed(state.feed)));
    box.appendChild(engineeringPart("eng:ledger", "CodeRabbit ledger", renderLedger(state.ledger)));
    box.appendChild(engineeringPart("eng:github", "GitHub", renderGithub(state.github, state.refs)));
    sec.appendChild(box);
    return sec;
  }

  function render(state) {
    if (!state) return;
    rendering = true;
    clock.textContent = "server " + (state.server_time_et || "");
    var ui = captureUi();
    var focusBefore = document.activeElement;
    var focusId = focusBefore && focusBefore.id;
    var focusJourney = focusBefore && focusBefore.dataset && focusBefore.dataset.journey;
    var focusDetails = focusBefore && focusBefore.tagName === "SUMMARY" && focusBefore.parentElement && focusBefore.parentElement.tagName === "DETAILS" ? focusBefore.parentElement.dataset.key : null;
    beginDetails();
    var frag = document.createDocumentFragment();
    frag.appendChild(renderOverview(state));
    latestExecutiveState = state;
    frag.appendChild(renderExecutiveDecisions(state));
    frag.appendChild(renderFeatureDelivery(state));
    frag.appendChild(renderExecutiveOperations(state));
    frag.appendChild(renderSalesMarketing(state));
    frag.appendChild(renderActive(state.active, state));
    frag.appendChild(renderPhase2(state.utilization && state.utilization.executive && state.utilization.executive.phase2));
    frag.appendChild(renderAttention(state));
    frag.appendChild(renderDecisions(state.decisions, state.decision_link));
    frag.appendChild(renderProductGoals(state));
    frag.appendChild(renderGoalCards(state));
    frag.appendChild(renderAchievements(state));
    frag.appendChild(renderSystems(state));
    frag.appendChild(renderResourceSection(state));
    var insightDetails = takeDetails("resource-detail", "exec:insights");
    insightDetails.appendChild(el("summary", null, "Collected work insights"));
    insightDetails.appendChild(renderInsights(state.insights));
    frag.appendChild(insightDetails);
    frag.appendChild(renderSettingsSection());
    frag.appendChild(renderHistory(state));
    app.replaceChildren(frag);
    restoreUi(ui);
    var focusAfter = focusId ? document.getElementById(focusId) : focusJourney ? app.querySelector('[data-journey="' + focusJourney + '"]') : null;
    if (!focusAfter && focusDetails) {
      var focusedDetails = Array.prototype.find.call(app.querySelectorAll("details[data-key]"), function (node) { return node.dataset.key === focusDetails; });
      if (focusedDetails) focusAfter = Array.prototype.find.call(focusedDetails.children, function (node) { return node.tagName === "SUMMARY"; });
    }
    if (focusAfter && focusAfter.focus) focusAfter.focus({preventScroll:true});
  }

  // Keep expanders open/closed and scroll positions stable across SSE re-renders.
  var OPEN_KEY = "monitor.open.v1";
  var openState = {};
  try { openState = JSON.parse(localStorage.getItem(OPEN_KEY) || "{}") || {}; } catch (e) { openState = {}; }
  function uiKey(node, idx) {
    if (node.dataset && node.dataset.key) return node.dataset.key;
    var sec = node.closest("section");
    var sum = node.querySelector && node.querySelector(":scope > summary");
    var label = sum ? sum.textContent.replace(/\s+—.*$/, "").slice(0, 80) : "";
    return (sec && sec.id ? sec.id : "app") + ":" + node.tagName + ":" + (label || idx);
  }
  function scrollables() {
    return Array.prototype.filter.call(app.querySelectorAll("pre, .scroll, ul, ol, div, table"), function (n) {
      return n.scrollHeight > n.clientHeight + 2 || n.scrollWidth > n.clientWidth + 2 || n.scrollTop || n.scrollLeft;
    });
  }
  function captureUi() {
    var scroll = {};
    scrollables().forEach(function (n, i) {
      if (n.scrollTop || n.scrollLeft) scroll[uiKey(n, i)] = [n.scrollTop, n.scrollLeft];
    });
    return { scroll: scroll, x: window.scrollX, y: window.scrollY };
  }
  function restoreUi(ui) {
    app.querySelectorAll("details").forEach(function (d, i) {
      var k = uiKey(d, i);
      d.dataset.key = k;
      if (d._keepOpen) d.open = true;
      else if (Object.prototype.hasOwnProperty.call(openState, k)) d.open = !!openState[k];
      if (d._toggleBound) return;
      d._toggleBound = true;
      d.addEventListener("toggle", function () {
        // A node leaving the document fires toggle in WebKit. That event must not clear the saved state.
        if (rendering || !d.isConnected) return;
        var key = d.dataset.key;
        if (!key) return;
        openState[key] = d.open;
        try { localStorage.setItem(OPEN_KEY, JSON.stringify(openState)); } catch (e) {}
      });
    });
    scrollables().forEach(function (n, i) {
      var v = ui.scroll[uiKey(n, i)];
      if (v) { n.scrollTop = v[0]; n.scrollLeft = v[1]; }
    });
    window.scrollTo(ui.x, ui.y);
    rendering = true;
    setTimeout(function () { rendering = false; }, 0);
  }
  var rendering = false;

  function startPoll() {
    if (pollTimer) return;
    live.textContent = "fetch polling every 5s";
    function tick() {
      fetch("/api/state", { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("Snapshot request failed");
        return r.json();
      }).then(function (state) {
        if (!state || typeof state !== "object" || Array.isArray(state)) throw new Error("Invalid snapshot");
        render(state);
        live.textContent = "fetch polling every 5s";
      }).catch(function () {
        live.textContent = "fetch failed; retrying";
      });
    }
    tick();
    pollTimer = setInterval(tick, 5000);
  }

  function startES() {
    if (!window.EventSource) { startPoll(); return; }
    var es = new EventSource("/api/events");
    es.addEventListener("state", function (ev) {
      esFails = 0;
      live.textContent = "live";
      try { render(JSON.parse(ev.data)); } catch (e) { live.textContent = "bad snapshot"; }
    });
    es.onerror = function () {
      esFails += 1;
      if (esFails >= 3) {
        es.close();
        startPoll();
      }
    };
  }
  startES();
})();
</script>
</body>
